strategy: weighted_random
default_timeout_ms: 5000
max_retries: 3
default_tolerance: Balanced
providers:
  - id: alchemy_eth
    url: https://eth-mainnet.g.alchemy.com/v2/demo
    base_weight: 900
    max_connections: 32
    timeout_ms: 2000
  - id: cloudflare_eth
    url: https://cloudflare-eth.com
    base_weight: 400
    max_connections: 16
    timeout_ms: 2500
  - id: blastapi_eth
    url: https://eth-mainnet.public.blastapi.io
    base_weight: 300
    max_connections: 16
    timeout_ms: 3000
methods:
  default:
    timeout_ms: 5000
    weight_multiplier: 1.0
    max_retries: 3
  groups:
    read:
      tolerance: Relaxed
      timeout_ms: 4500
      weight_multiplier: 1.2
      max_retries: 2
    write:
      tolerance: Strict
      timeout_ms: 9000
      weight_multiplier: 0.8
      max_retries: 4
  overrides:
    - pattern: "eth_get*"
      group: read
    - pattern: "eth_sendRawTransaction"
      group: write
