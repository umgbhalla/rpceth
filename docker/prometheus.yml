global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "rpc-proxy-monitor"

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: "rpc_proxy_application_metrics"
    static_configs:
      - targets: ["otel-collector:8889"]
    scrape_interval: 5s
    metrics_path: /metrics
    honor_labels: true

  - job_name: "rpc_proxy_span_metrics"
    static_configs:
      - targets: ["otel-collector:8887"]
    scrape_interval: 5s
    metrics_path: /metrics
    honor_labels: true
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "rpc_proxy_spans_(.+)"
        target_label: __name__
        replacement: "span_${1}"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "rpc_proxy_direct"
    static_configs:
      - targets: ["host.docker.internal:3000"]
    scrape_interval: 5s
    metrics_path: /metrics
    honor_labels: true
